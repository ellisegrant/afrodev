<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Installed-app chrome: matched light/dark bars, standalone launch, and
         a title short enough to sit under a home-screen icon. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F7F5F0" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#11100D" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Afrodev" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-180.png" />

    <title>Ellise Grant Boamah — Software Developer</title>
    <meta name="description" content="Ellise Grant Boamah (Afrodev) is a software developer in Accra, Ghana, building full-stack products for the web." />
    <meta name="author" content="Ellise Grant Boamah" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Ellise Grant Boamah — Software Developer" />
    <meta property="og:description" content="Software developer in Accra, Ghana. Full-stack product work for the web." />
    <meta property="og:image" content="/og.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

    <script>
      (function () {
        var t = localStorage.getItem('theme');
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
